name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify tag matches application version
        run: |
          python -c 'import os; from tidbyt_agent_alerts import __version__; tag = os.environ["GITHUB_REF_NAME"]; expected = "v" + __version__; tag == expected or exit(f"Release tag {tag!r} does not match application version {expected!r}")'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package.py
      - name: Publish archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/bootstrap.sh dist/SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/bootstrap.sh dist/SHA256SUMS --verify-tag --generate-notes
          fi
